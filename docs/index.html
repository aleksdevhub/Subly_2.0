<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subly</title>
  <!-- Библиотека Telegram запоминает данные пользователя до перехода на главную -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Telegram передаёт данные пользователя в адресе после «#» — переносим их на главную
    // ?v=… — чтобы телефон каждый раз брал свежую версию страницы, а не старую из кэша
    location.replace('dashboard.html?v=' + Date.now() + location.hash);
  </script>
</head>
<body></body>
</html>
