<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/js/theme.js"></script>
  <title>Регистрация — Subly</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <div class="auth">
    <!-- Кнопка смены темы (правый верхний угол) -->
    <button class="theme-fab" data-theme-toggle aria-label="Сменить тему"><span class="theme-icon"><span class="sun"><i data-icon="sun"></i></span><span class="moon"><i data-icon="moon"></i></span></span></button>

    <!-- Мягкое цветное свечение на фоне -->
    <div class="auth-glow" aria-hidden="true"><span class="g1"></span><span class="g2"></span></div>

    <!-- Форма регистрации -->
    <main class="auth-main">
      <a href="/login.html" class="logo auth-logo"><span class="logo-mark"><i data-icon="repeat" data-size="16"></i></span>Subly</a>
      <form class="auth-form" id="register-form" novalidate>
        <div class="head">
          <h1 class="h1">Создайте аккаунт</h1>
          <p class="small muted">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
        </div>

        <div id="form-msg"></div>

        <div class="field">
          <label for="name">Имя</label>
          <div class="input-wrap">
            <i data-icon="user"></i>
            <input id="name" type="text" placeholder="Как к вам обращаться" autocomplete="name">
          </div>
          <div class="hint hidden" id="name-hint"></div>
        </div>

        <div class="field">
          <label for="email">Электронная почта</label>
          <div class="input-wrap">
            <i data-icon="mail"></i>
            <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="hint hidden" id="email-hint"></div>
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <div class="input-wrap">
            <i data-icon="lock"></i>
            <input id="password" type="password" placeholder="Придумайте пароль" autocomplete="new-password">
            <button type="button" class="toggle-pwd" data-for="password" aria-label="Показать пароль"><i data-icon="eye"></i></button>
          </div>
          <div class="hint" id="password-hint">Минимум 8 символов, буквы и цифры</div>
        </div>

        <div class="field">
          <label for="password2">Повторите пароль</label>
          <div class="input-wrap">
            <i data-icon="lock"></i>
            <input id="password2" type="password" placeholder="Ещё раз" autocomplete="new-password">
            <button type="button" class="toggle-pwd" data-for="password2" aria-label="Показать пароль"><i data-icon="eye"></i></button>
          </div>
          <div class="hint hidden" id="password2-hint"></div>
        </div>

        <label class="checkbox">
          <input type="checkbox" id="agree">
          <span class="box"><i data-icon="check" data-size="14" data-stroke="3"></i></span>
          <span>Я принимаю условия использования и политику конфиденциальности</span>
        </label>

        <button class="btn btn-primary btn-block" type="submit" id="submit">Зарегистрироваться</button>
      </form>

      <!-- Чем полезен сервис — коротко -->
      <ul class="auth-perks">
        <li><i data-icon="bell" data-size="16"></i>Напомнит о списании</li>
        <li><i data-icon="chart" data-size="16"></i>Покажет расходы</li>
        <li><i data-icon="grid" data-size="16"></i>Разложит по категориям</li>
      </ul>
      <p class="caption faint auth-copy">© 2026 Subly</p>
    </main>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script>initRegister();</script>
</body>
</html>
